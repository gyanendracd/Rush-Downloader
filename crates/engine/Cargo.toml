[package]
name = "rushdownload-engine"
version = "0.1.0"
edition = "2021"
description = "Multi-connection, resumable download engine"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
regex = "1"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
# Already built for the secure connections; used to check web-seeded torrent pieces.
ring = "0.17"
